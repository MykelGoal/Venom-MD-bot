services:
  - type: web
    name: venom-md-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SESSION_ID
        sync: false
      - key: OWNER_NUMBER
        sync: false
